name: Build and Release

# Builds installers for every platform and attaches them to a GitHub Release.
#
# macOS builds run here too rather than on a maintainer's machine, so a
# release always comes from the same source revision on all three platforms.
#
# Trigger it by pushing a tag that matches v*:
#   git tag v1.0.0 && git push origin v1.0.0
#
# Or run it by hand from the Actions tab ("Run workflow").

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag to publish, e.g. v1.0.0'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (arm64)
            os: macos-latest
            arch: arm64
            build_args: --mac --arm64
          - name: macOS (x64)
            os: macos-latest
            arch: x64
            build_args: --mac --x64
          - name: Windows (x64)
            os: windows-latest
            arch: x64
            build_args: --win --x64
          - name: Linux (x64)
            os: ubuntu-latest
            arch: x64
            build_args: --linux --x64

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        working-directory: app
        run: npm ci

      - name: Build
        working-directory: app
        run: npm run build

      - name: Package
        working-directory: app
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # No signing certificate is available to this workflow, so skip the
          # search rather than failing on it.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder ${{ matrix.build_args }} --publish never

      - name: Collect artifacts
        shell: bash
        run: |
          mkdir -p out
          find app/release -maxdepth 1 -type f \( \
            -name '*.dmg' -o -name '*.zip' -o -name '*.exe' -o \
            -name '*.AppImage' -o -name '*.blockmap' -o -name 'latest*.yml' \
          \) -exec cp {} out/ \;

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: marmot-${{ matrix.arch }}-${{ matrix.os }}
          path: out/
          retention-days: 14

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List assets
        run: ls -lh dist/

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.version || github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; uploading assets to it."
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* \
              --title "Marmot $TAG" \
              --generate-notes \
              --notes "See the commit log for the full list of changes.

            Downloads:
            - macOS: pick the .dmg for your architecture (Apple Silicon or Intel).
            - Windows: the .exe installer, or the .zip for a portable copy.
            - Linux: the .AppImage runs anywhere, the .deb suits Debian/Ubuntu."
          fi
